# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: timoha-market
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://krm-demo.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: timoha-db
          property: connectionString
databases:
  - name: timoha-db
    plan: free
