name: Publish container image
# Builds the Dockerfile and pushes it to GitHub Container Registry (free for
# public repos). Azure Container Apps (or any host) can then pull
# ghcr.io/<owner>/<repo>:latest, so no paid Azure Container Registry is needed.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'Dockerfile', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
