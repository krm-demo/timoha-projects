<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timoha Market — marketplace prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23fad318%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 font-family=%22Arial%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%2326066f%22%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-bar">Prototype for the Eneba Intern Assignment 2027 · demo data, simulated payments, not affiliated with Eneba</div>
<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#/"><span class="logo-mark">T</span><span>timoha<b>market</b></span></a>
    <nav class="nav">
      <a href="#/store">Store</a>
      <a href="#/store?type=Gift%20card">Gift cards</a>
      <a href="#/store?sort=discount">Deals</a>
    </nav>
    <div class="search" id="search">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="q" type="search" placeholder="Search games, gift cards…" autocomplete="off">
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div class="hdr-actions">
      <a class="icon-btn" href="#/cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5.2 4l.4 2H21l-2.2 9H7.4L4.4 2H1V0h4.9z" transform="translate(0 1)"/></svg>
        <span class="badge" id="cartCount" hidden>0</span>
      </a>
      <span id="userSlot"></span>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer class="ftr"><div class="wrap">Timoha Market · prototype by Tymofii Svyrhun · built with an AI agent · <a href="https://github.com/krm-demo/ai-timoha-projects" id="repoLink">source</a></div></footer>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
